gn-items-center"><i _ngcontent-sc71="" class="dp-icon dp-icon-social-network-telegram-logo"></i></div></div></div></div><!----></div></app-article-info></div></app-article-header-content-size></div><!----><div _ngcontent-sc115="" class="paragraph-wrapper"><app-article-paragraph _ngcontent-sc115="" _nghost-sc101=""><!----><!----><app-paragraph-text _ngcontent-sc101="" _nghost-sc76=""><div _ngcontent-sc76="" class="paragraph paragraph-text">Из Петербурга и Мурманска в Турцию планируют поставить около 100 тыс. тонн чугуна, пишет "Ъ" со ссылкой на обзор SteelOrbis.</div></app-paragraph-text><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----></app-article-paragraph><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----></div><div _ngcontent-sc115="" class="paragraph-wrapper"><app-article-paragraph _ngcontent-sc115="" _nghost-sc101=""><!----><!----><app-paragraph-text _ngcontent-sc101="" _nghost-sc76=""><div _ngcontent-sc76="" class="paragraph paragraph-text">Две сделки заключили в октябре 2026 года.</div></app-paragraph-text><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----></app-article-paragraph><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----></div><div _ngcontent-sc115="" class="paragraph-wrapper"><app-article-paragraph _ngcontent-sc115="" _nghost-sc101=""><!----><!----><!----><!----><!----><!----><!----><!----><app-paragraph-quote _ngcontent-sc101="" _nghost-sc96=""><div _ngcontent-sc96="" class="paragraph quote d-flex"><div _ngcontent-sc96="" class="symbol d-none d-md-block">“</div><div _ngcontent-sc96="" class="content dp-font-alegreyaItalic">"Российским металлургам удалось воспользоваться ростом интереса турецких заводов, пополняющих запасы, к закупкам чугуна. По данным аналитиков, в октябре было заключено как минимум две сделки на поставку 100 тыс. тонн сырья из Санкт-Петербурга и Мурманска. Последняя партия для покупателей может оказаться выгоднее, учитывая рост стоимости фрахта из Балтики", — <a href="https://www.kommersant.ru/doc/9060196?query=Петербург#~k-highlight=eyJ0aW1lc3RhbXAiOjE3OTI5ODczOTUsImRvY0hhc2giOiIwTU11LVZGV0pZNE5lSkhYRVBSSnp5TWJEdFVlWmctRVhKWVp5QzEzN1Y0IiwiZ2FsbGVyeUhhc2giOiJqaGd3VGNWdHRNby0wRGJ5cUFOUFlJd3JQQkpCeHdPOThRVkw0QUNleFVJIn0" target="_blank">отмечает</a> издание. </div></div></app-paragraph-quote><!----><!----><!----><!----><!----><!----><!----></app-article-paragraph><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----></div><div _ngcontent-sc115="" class="paragraph-wrapper"><app-article-paragraph _ngcontent-sc115="" _nghost-sc101=""><!----><!----><app-paragraph-text _ngcontent-sc101="" _nghost-sc76=""><div _ngcontent-sc76="" class="paragraph paragraph-text">Уточняется, что из порта Санкт-Петербург отправят 40 тыс. тонн чугуна по $415 за тонну с учётом фрахта (CFR), а из Мурманска — 65 тыс. тонн примерно за $400 за тонну (CFR).</div></app-paragraph-text><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----></app-article-paragraph><!----><!----><!----><!----><div _ngcontent-sc115="" class="see-also d-xl-none"><span _ngcontent-sc115="" class="see-also-text">Новости по теме:</span><app-linked-article _ngcontent-sc115="" _nghost-sc102=""><!----><!----><a _ngcontent-sc102="" class="article-block d-flex flex-column justify-content-end article-link-block" href="a/2026/10/02/perevalka-zerna-v-rossijskih" target="_self"><div _ngcontent-sc102="" class="back-gradient1"></div><div _ngcontent-sc102="" class="article-block-content article-link-block-headline"><span _ngcontent-sc102="">Перевалка зерна в российских портах на Балтике выросла на треть за год</span></div></a><!----><!----><!----><!----><!----></app-linked-article><app-linked-article _ngcontent-sc115="" _nghost-sc102=""><!----><!----><a _ngcontent-sc102="" class="article-block d-flex flex-column justify-content-end article-link-block" href="a/2026/10/26/postavki-kitajskih-komplektujushhih" target="_self"><div _ngcontent-sc102="" class="back-gradient1"></div><div _ngcontent-sc102="" class="article-block-content article-link-block-headline"><span _ngcontent-sc102="">Поставки китайских комплектующих в&nbsp;порты СЗФО стимулируют рост рынка...</span></div></a><!----><!----><!----><!----><!----></app-linked-article><app-linked-article _ngcontent-sc115="" _nghost-sc102=""><!----><!----><a _ngcontent-sc102="" class="article-block d-flex flex-column justify-content-end article-link-block" href="a/2026/10/08/porti-severo-zapada-namereni" target="_self"><div _ngcontent-sc102="" class="back-gradient1"></div><div _ngcontent-sc102="" class="article-block-content article-link-block-headline"><span _ngcontent-sc102="">Порты Северо-Запада намерены побить рекорд по&nbsp;контейнерообороту</span></div></a><!----><!----><!----><!----><!----></app-linked-article><app-linked-article _ngcontent-sc115="" _nghost-sc102=""><!----><!----><a _ngcontent-sc102="" class="article-block d-flex flex-column justify-content-end article-link-block" href="a/2026/10/03/v-internete-rasprostranjajutsja" target="_self"><div _ngcontent-sc102="" class="back-gradient1"></div><div _ngcontent-sc102="" class="article-block-content article-link-block-headline"><span _ngcontent-sc102="">В интернете распространяются фейки о закрытии портов Ленинградской области </span></div></a><!----><!----><!----><!----><!----></app-linked-article><app-linked-article _ngcontent-sc115="" _nghost-sc102=""><!----><!----><a _ngcontent-sc102="" class="article-block d-flex flex-column justify-content-end article-link-block" href="a/2026/10/07/perevozchiki-opasajutsja-blokirovki" target="_self"><div _ngcontent-sc102="" class="back-gradient1"></div><div _ngcontent-sc102="" class="article-block-content article-link-block-headline"><span _ngcontent-sc102="">Перевозчики опасаются блокировки Балтийского моря для российских грузов</span></div></a><!----><!----><!----><!----><!----></app-linked-article><!----></div><!----><!----><div _ngcontent-sc115="" class="d-lg-none"><div _ngcontent-sc115="" class="d-flex justify-content-center"><app-adfox-banner _ngcontent-sc115="" _nghost-sc47=""><!----></app-adfox-banner></div></div><!----><!----><!----><!----></div><div _ngcontent-sc115="" class="paragraph-wrapper"><app-article-paragraph _ngcontent-sc115="" _nghost-sc101=""><!----><!----><app-paragraph-text _ngcontent-sc101="" _nghost-sc76=""><div _ngcontent-sc76="" class="paragraph paragraph-text">По словам аналитиков, обычно фрахт из Мурманска дороже, но из-за значительного объёма партии фрахтовые ставки могут оказаться даже ниже, чем в Петербурге.</div></app-paragraph-text><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----></app-article-paragraph><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----></div><div _ngcontent-sc115="" class="paragraph-wrapper"><app-article-paragraph _ngcontent-sc115="" _nghost-sc101=""><!----><!----><!----><!----><!----><!----><!----><!----><app-paragraph-quote _ngcontent-sc101="" _nghost-sc96=""><div _ngcontent-sc96="" class="paragraph quote d-flex"><div _ngcontent-sc96="" class="symbol d-none d-md-block">“</div><div _ngcontent-sc96="" class="content dp-font-alegreyaItalic">"Из-за высокой конкуренции с <a href="https://www.dp.ru/a/2026/10/02/perevalka-zerna-v-rossijskih" target="_blank">зерновыми грузами</a> стоимость фрахта из Санкт-Петербурга для чугуна объёмом 30 тыс. тонн выросла на $10, до $70–75 за тонну", — указано в публикации. </div></div></app-paragraph-quote><!----><!----><!----><!----><!----><!----><!----></app-article-paragraph><!----><div _ngcontent-sc115=""><div _ngcontent-sc115="" class="d-flex justify-content-center justify-content-xl-start"><app-adfox-banner _ngcontent-sc115="" style="width: 100%; max-width: 800px;" _nghost-sc47=""><!----></app-adfox-banner></div></div><!----><!----><!----><!----><div _ngcontent-sc115="" class="see-also d-xl-none"><app-most-read _ngcontent-sc115="" _nghost-sc103=""><div _ngcontent-sc103="" class="d-flex flex-column most-read-container"><div _ngcontent-sc103="" class="most-read-title-container"><div _ngcontent-sc103="" class="most-read-title"><span _ngcontent-sc103="">Читайте также</span></div></div><div _ngcontent-sc103="" class="most-read-articles-container"><!----><a _ngcontent-sc103="" class="d-block article-block" href="/a/2026/11/02/ostavshijsja-bez-rossijan-finskij"><div _ngcontent-sc103="" class="d-flex flex-column"><span _ngcontent-sc103="" class="d-block headline">Оставшийся без россиян финский аэропорт получил год отсрочки от закрытия</span></div></a><!----><!----><!----><a _ngcontent-sc103="" class="d-block article-block" href="/a/2026/11/06/kirkorov-ili-prazdnik-bez"><div _ngcontent-sc103="" class="d-flex flex-column"><span _ngcontent-sc103="" class="d-block headline">Киркоров или праздник без пафоса: как бизнес проведёт новогодние корпоративы</span></div></a><!----><!----><!----><a _ngcontent-sc103="" class="d-block article-block" href="/a/2026/11/02/avstrijci-kupili-krupnij-lesopilnij"><div _ngcontent-sc103="" class="d-flex flex-column"><span _ngcontent-sc103="" class="d-block headline">Австрийцы купили крупный лесопильный завод в Финляндии у границы с Россией</span></div></a><!----><!----><!----></div></div></app-most-read></div><!----><!----><!----><!----><!----></div><div _ngcontent-sc115="" class="paragraph-wrapper"><app-article-paragraph _ngcontent-sc115="" _nghost-sc101=""><!----><!----><app-paragraph-text _ngcontent-sc101="" _nghost-sc76=""><div _ngcontent-sc76="" class="paragraph paragraph-text">В целом в августе 2026 года Россия увеличила экспорт чугуна в Турцию на 61% год к году, до 118,9 тыс. тонн (+42,9% за восемь месяцев).</div></app-paragraph-text><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----></app-article-paragraph><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----></div><div _ngcontent-sc115="" class="paragraph-wrapper"><app-article-paragraph _ngcontent-sc115="" _nghost-sc101=""><!----><!----><app-paragraph-text _ngcontent-sc101="" _nghost-sc76=""><div _ngcontent-sc76="" class="paragraph paragraph-text">В 2025 году экспорт чёрных металлов в порты Северо-Запада <a href="https://www.dp.ru/a/2025/09/26/jeksport-chjornih-metallov-v#1" target="_blank">вырос</a> на 35,6% за восемь месяцев по сравнению с аналогичным периодом 2024 года — до 2,5 млн тонн. Петербург и Ленинградская область остаются ключевыми экспортными воротами для металлургической продукции, однако Мурманский морской торговый порт возобновил перевалку чугуна, с которым не работал с 1996 года, в условиях ограничений для судоходства в Азово-Черноморском бассейне и роста нагрузки на порты Балтики.</div></app-paragraph-text><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----></app-article-paragraph><!----><!----><div _ngcontent-sc115=""><div _ngcontent-sc115="" class="d-flex justify-content-center justify-content-xl-start"><app-adfox-banner _ngcontent-sc115="" style="width: 100%; max-width: 850px;" _nghost-sc47=""><!----></app-adfox-banner></div></div><!----><!----><!----><!----><!----><!----><!----><!----></div><div _ngcontent-sc115="" class="paragraph-wrapper"><app-article-paragraph _ngcontent-sc115="" _nghost-sc101=""><!----><!----><app-paragraph-text _ngcontent-sc101="" _nghost-sc76=""><div _ngcontent-sc76="" class="paragraph paragraph-text">Кроме того металлурги говорят, что перенаправление поставок на Балтику повышает логистические издержки, а дефицит мощностей в ряде портов Северо-Запада не позволяет формировать партии и фрахтовать суда.</div></app-paragraph-text><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----></app-article-paragraph><!----><!----><!----><!----><!----><!----><!----><div _ngcontent-sc115="" class="d-lg-none"><div _ngcontent-sc115="" class="d-flex justify-content-center"><app-adfox-banner _ngcontent-sc115="" _nghost-sc47=""><!----></app-adfox-banner></div></div><!----><!----><!----></div><div _ngcontent-sc115="" class="paragraph-wrapper"><app-article-paragraph _ngcontent-sc115="" _nghost-sc101=""><!----><!----><app-paragraph-text _ngcontent-sc101="" _nghost-sc76=""><div _ngcontent-sc76="" class="paragraph paragraph-text">Тем временем перевозчики опасаются <a href="https://www.dp.ru/a/2026/10/07/perevozchiki-opasajutsja-blokirovki" target="_blank">блокировки</a> Балтийского моря для российских грузов на фоне ситуации с портами Азово-Черноморского бассейна, проблем с поставками на Кубу и задержания контейнеровоза Nora в Дании. Эксперты напоминают, что похожее давление порты Балтики уже переживали в 2022 году, когда ушли все глобальные перевозчики, однако тогда их удалось заместить. Сейчас логисты боятся, что экспортные маршруты из Петербурга, Усть-Луги, Приморска, Высоцка, Выборга и Калининграда через датские проливы могут быть перекрыты. Несмотря на трактат 1857 года, гарантирующий свободный проход судов, прецедент с остановкой контейнеровоза Nora уже создан, и угроза преследования сохраняется.</div></app-paragraph-text><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----></app-article-paragraph><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----></div><div _ngcontent-sc115="" class="paragraph-wrapper"><app-article-paragraph _ngcontent-sc115="" _nghost-sc101=""><!----><!----><app-paragraph-text _ngcontent-sc101="" _nghost-sc76=""><div _ngcontent-sc76="" class="paragraph paragraph-text">Ранее, в июне 2026 года, о риске блокады Балтики и Чёрного моря, обслуживающих основной объём российской морской торговли, <a href="https://tass.ru/politika/27763943" target="_blank">предупреждал</a> и помощник президента, председатель Морской коллегии Николай Патрушев.</div></app-paragraph-text><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----><!----></app-article-paragraph><div _ngcontent-sc115="" class="mt-3 ad
