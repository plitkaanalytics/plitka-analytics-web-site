etterV3:8173d1045ee"},"linkedAccounts":{"__ref":"LinkedAccounts:74788ae4731c"},"isSuspended":false,"bio":"ADDO is a coalition of digital democracy research organisations that offer research grants + technical support, residential fellowships & access to AI\u002FML tools.","verifications":{"__typename":"VerifiedInfo","isBookAuthor":false},"imageId":"1*6zumhoNwzOZoYJP3oWNBWw.png","socialStats":{"__typename":"SocialStats","followerCount":433,"followingCount":2,"collectionFollowingCount":1},"allowNotes":true,"membership":{"__ref":"Membership:f1a9021c-ddca-452e-9dc7-2bca8b88e8e6"},"viewerEdge":{"__ref":"UserViewerEdge:userId:74788ae4731c-viewerId:lo_d8ea5b94a726"},"twitterScreenName":""},"Collection:524f394c6433":{"__typename":"Collection","id":"524f394c6433","domain":"disinfo.africa","slug":"disinfo-africa","googleAnalyticsId":null,"name":"African Digital Democracy Observatory","avatar":{"__typename":"ImageMetadata","id":"1*6zumhoNwzOZoYJP3oWNBWw.png"},"description":"ADDO is a coalition of investigative analysis + forensic research organisations that monitor how digital tools and civic technologies impact on the rights of African citizens.","latestPostsConnection({\"paging\":{\"limit\":1}})":{"__typename":"PostConnection","posts":[{"__ref":"Post:09823dac2d82"}]},"subscriberCount":281,"viewerEdge":{"__ref":"CollectionViewerEdge:collectionId:524f394c6433-viewerId:lo_d8ea5b94a726"},"twitterUsername":"Code4Africa","facebookPageId":null},"Post:09823dac2d82":{"__typename":"Post","id":"09823dac2d82","firstPublishedAt":1789137246864,"creator":{"__ref":"User:74788ae4731c"},"collection":{"__ref":"Collection:524f394c6433"},"isSeries":false,"mediumUrl":"https:\u002F\u002Fdisinfo.africa\u002Fhow-disinformation-targeted-ethiopias-women-candidates-09823dac2d82","sequence":null,"uniqueSlug":"how-disinformation-targeted-ethiopias-women-candidates-09823dac2d82"},"LinkedAccounts:74788ae4731c":{"__typename":"LinkedAccounts","mastodon":null,"id":"74788ae4731c"},"NewsletterV3:8173d1045ee":{"__typename":"NewsletterV3","id":"8173d1045ee","type":"NEWSLETTER_TYPE_AUTHOR","slug":"74788ae4731c","name":"74788ae4731c","collection":null,"user":{"__ref":"User:74788ae4731c"}},"Paragraph:a136b75cc8e4_0":{"__typename":"Paragraph","id":"a136b75cc8e4_0","name":"ba89","type":"H3","href":null,"layout":null,"metadata":null,"text":"Tinzaouaten attacks: Unpacking the narratives and actors","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_1":{"__typename":"Paragraph","id":"a136b75cc8e4_1","name":"37fc","type":"P","href":null,"layout":null,"metadata":null,"text":"In the aftermath of the attack, disinformation campaigns surged online, portraying Russia as Mali’s defender against foreign aggression","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_2":{"__typename":"Paragraph","id":"a136b75cc8e4_2","name":"6eb4","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*bIMXTnMSMBaAVC0sWIdcjQ.png","originalHeight":850,"originalWidth":1520,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_3":{"__typename":"Paragraph","id":"a136b75cc8e4_3","name":"eebd","type":"P","href":null,"layout":null,"metadata":null,"text":"The recent clashes in Tinzaouaten, near Mali’s border with Algeria, have been exploited by pro-Russian networks to push anti-Western narratives. The conflict, involving the Malian army with Russian Wagner Group mercenaries, Tuareg separatist rebels, and Al-Qaeda-linked militants, has been framed as part of a broader struggle against Western imperialism. Online, pro-Russian accounts claimed that Russia was acting to counter Western influence and protect Malian sovereignty, amplifying disinformation suggesting NATO’s involvement in destabilising the region.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":11,"end":18,"href":"https:\u002F\u002Fperma.cc\u002FR7MH-HJWE?type=image","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_4":{"__typename":"Paragraph","id":"a136b75cc8e4_4","name":"852b","type":"P","href":null,"layout":null,"metadata":null,"text":"Between 22 and 27 July 2024, intense fighting in Mali’s northern Kidal region led to significant casualties. Media reports indicated that between 20 and 80 Wagner mercenaries, together with 10 Malian soldiers, were killed in the clashes. Both the Coordination of Azawad Movements (CMA) and Al-Qaeda-affiliated group Jama’at Nasr al-Islam wal Muslimin (JNIM) claimed responsibility for the ambush, leading to disputes over the operation’s success.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":115,"end":122,"href":"https:\u002F\u002Fperma.cc\u002F7GVA-UQYS","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":247,"end":279,"href":"https:\u002F\u002Fperma.cc\u002FM9SL-CSL4","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":316,"end":350,"href":"https:\u002F\u002Fperma.cc\u002FN95U-MMA9","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_5":{"__typename":"Paragraph","id":"a136b75cc8e4_5","name":"5717","type":"P","href":null,"layout":null,"metadata":null,"text":"In the aftermath of the attack, coordinated disinformation campaigns surged online, portraying Russia as Mali’s defender against foreign aggression, as they were reported to be delivering advanced military support to Mali. These campaigns were driven by prominent social media accounts, resharing content to increase visibility and credibility. Despite debunking, the disinformation spread widely, underscoring the effectiveness of these online campaigns in shaping perceptions. This reflects a broader trend of disinformation in Mali, where both extremist groups and pro-Russian forces manipulate narratives to gain influence and justify their actions in the ongoing conflict.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_6":{"__typename":"Paragraph","id":"a136b75cc8e4_6","name":"9fb9","type":"P","href":null,"layout":null,"metadata":null,"text":"What are the extremist groups in Mali?","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":0,"end":38,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_7":{"__typename":"Paragraph","id":"a136b75cc8e4_7","name":"f122","type":"P","href":null,"layout":null,"metadata":null,"text":"The Wagner Group \nThe Wagner Group, a Kremlin-backed Russian paramilitary organisation, recently rebranded as Africa Corps, has become increasingly influential in global conflicts, often aligning with Russia’s geopolitical aims. As France began to reduce its military presence in Mali, the latter sought alternative security partnerships, leading to the controversial decision to bring in Wagner operatives. Reports from international sources like ReliefWeb indicated that the Malian government had signed a deal with Wagner to provide military support, including training for the Malian army, logistics, and direct involvement in counterinsurgency operations against extremist groups. Despite these widespread reports, the Malian government officially denied the presence of Wagner forces in 2021, framing its security cooperation as purely with the Russian state, not a private military company. However, the evidence of Wagner’s involvement is substantial. The UN, European Union, and various human rights organisations have also expressed concern about Wagner’s presence in Mali, particularly relating to alleged human rights abuses. These reports include claims of extrajudicial killings, torture, and other violent acts against civilians, specifically in areas in which Wagner operatives and the Malian army have conducted joint operations against insurgents.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":38,"end":60,"href":"https:\u002F\u002Fperma.cc\u002FDZ6K-R7DV","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":239,"end":244,"href":"https:\u002F\u002Fperma.cc\u002F6LRN-AJCX","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":448,"end":457,"href":"https:\u002F\u002Fperma.cc\u002FD9TJ-F66K","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":753,"end":759,"href":"https:\u002F\u002Fperma.cc\u002FDU88-SP93","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":1033,"end":1042,"href":"https:\u002F\u002Fperma.cc\u002FK3P3-DTAU","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":18,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_8":{"__typename":"Paragraph","id":"a136b75cc8e4_8","name":"ec80","type":"P","href":null,"layout":null,"metadata":null,"text":"Jama’at Nasr al-Islam wal Muslimin","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":0,"end":34,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_9":{"__typename":"Paragraph","id":"a136b75cc8e4_9","name":"fab3","type":"P","href":null,"layout":null,"metadata":null,"text":"JNIM is an Islamist militant group active in Mali and West Africa, formed in 2017 through the merger of several jihadist factions. The terrorist group, which is aligned with Al-Qaeda, seeks to impose Shariah law across the Sahel and has been responsible for numerous attacks on military and civilian targets, intensifying the region’s security crisis. JNIM’s strategic blueprint includes a combination of guerrilla warfare, strategic use of violence, governance and population control, economic warfare, and sophisticated media and propaganda operations. For nearly a decade, French forces and the United Nations Multidimensional Integrated Stabilisation Mission in Mali were the main targets of JNIM propaganda, but this has shifted over the past year to focus more on Africa Corps (or, as JNIM still calls the unit, Wagner). The group’s media wing, Az-Zallaqa, uses platforms like Chirpwire to spread its propaganda, operational updates, and recruitment content while avoiding mainstream detection.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":67,"end":73,"href":"https:\u002F\u002Fperma.cc\u002FMB35-W4N8","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":174,"end":182,"href":"https:\u002F\u002Fperma.cc\u002FMB35-W4N8","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":883,"end":892,"href":"https:\u002F\u002Fperma.cc\u002F7WBH-9ZCT","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_10":{"__typename":"Paragraph","id":"a136b75cc8e4_10","name":"5e41","type":"P","href":null,"layout":null,"metadata":null,"text":"Coordination of Azawad Movements\nCMA, formed in 2014 as a coalition of Tuareg and Arab nationalist groups, seeks autonomy or independence for the Azawad region. CMA emerged from the Tuareg rebellion that began in 2012, which saw the declaration of Azawad’s independence before the region was swiftly overtaken by Islamist groups. The coalition has been involved in various peace negotiations with the Malian government, seeking greater political recognition and autonomy for the region within a federal Malian state. The movement uses various media outlets to promote its cause, including the Tanakra website, the Arab Azawad Movement’s Facebook page, Voices of the Sahara, and the Sawt-Al-Haq website, all dedicated to Sahel-related news and CMA activities.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":38,"end":44,"href":"https:\u002F\u002Fperma.cc\u002F8W9S-N87S","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":204,"end":209,"href":"https:\u002F\u002Fperma.cc\u002F73FE-TG8D","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":593,"end":600,"href":"https:\u002F\u002Fperma.cc\u002FR5Y4-994A","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":614,"end":650,"href":"https:\u002F\u002Fperma.cc\u002FB6ZH-BMSS","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":652,"end":672,"href":"https:\u002F\u002Fperma.cc\u002F3K6F-6RZV","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":682,"end":693,"href":"https:\u002F\u002Fperma.cc\u002FGR97-7RTT","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":32,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_11":{"__typename":"Paragraph","id":"a136b75cc8e4_11","name":"4e25","type":"P","href":null,"layout":null,"metadata":null,"text":"Narratives driven by Pro-Russian actors","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":0,"end":39,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_12":{"__typename":"Paragraph","id":"a136b75cc8e4_12","name":"02a5","type":"ULI","href":null,"layout":null,"metadata":null,"text":"Russia is a strong military ally to Mali","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":0,"end":40,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":0,"end":40,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_13":{"__typename":"Paragraph","id":"a136b75cc8e4_13","name":"02cc","type":"P","href":null,"layout":null,"metadata":null,"text":"During the Tinzaouaten attacks and in the days that followed, a coordinated network of Facebook accounts began amplifying disinformation, claiming that Russia had delivered military equipment to Mali. This narrative, driven by pro-Russian actors, suggested that Russian president Vladimir Putin had ordered the deployment of military assets in response to NATO’s alleged involvement in the attack. The campaign also highlighted Russia’s previous cooperation with Mali in telecommunications, surveillance, and border control while also portraying Russia as a defender against French imperialism in the region.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_14":{"__typename":"Paragraph","id":"a136b75cc8e4_14","name":"6849","type":"P","href":null,"layout":null,"metadata":null,"text":"Between 22 and 27 July 2024, 340 X accounts and 28 Facebook accounts used rewording and copy-pasting to amplify allegations and pro-Russia praise from a network of eight pro-Russia accounts. These included six X accounts — @DelphineSankara, @DelphineSora, @Abaslescons74, @AES, @MakanMoo, and @ThakoutioN — and two Facebook accounts — PutinTv, and EgounthiBenhazin — which frequently repost and share similar content about Alliance of Sahel States (AES) members, anti-West messaging, and pro-Russia narratives among themselves.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":223,"end":239,"href":"https:\u002F\u002Fperma.cc\u002FD7Q9-DEBM?type=standard","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":241,"end":254,"href":"https:\u002F\u002Fperma.cc\u002FUN8A-8AYH","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":256,"end":270,"href":"https:\u002F\u002Fperma.cc\u002F7YZM-PX82","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":272,"end":276,"href":"https:\u002F\u002Fperma.cc\u002F83S6-EYV4","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":278,"end":287,"href":"https:\u002F\u002Fperma.cc\u002FN4SJ-B7WH?type=standard","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":293,"end":304,"href":"https:\u002F\u002Fperma.cc\u002FM53M-WGAA","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":335,"end":342,"href":"https:\u002F\u002Fperma.cc\u002FE98J-H2DQ","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":348,"end":364,"href":"https:\u002F\u002Fperma.cc\u002F78DV-QVR2","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_15":{"__typename":"Paragraph","id":"a136b75cc8e4_15","name":"867d","type":"P","href":null,"layout":null,"metadata":null,"text":"The accounts in the network praised the technical and military cooperation with Russia, arguing that partnering with the country is instrumental in stopping French imperialism. They simultaneously amplified old posts of Russian interventions in Mali to restore trust in Russia and portray the latter as a good partner. This content received 1,200 social media interactions, including 63 reposts of the old posts.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":148,"end":156,"href":"https:\u002F\u002Fperma.cc\u002F66AC-RQHZ","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":207,"end":216,"href":"https:\u002F\u002Fperma.cc\u002F65K5-PCD3","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_16":{"__typename":"Paragraph","id":"a136b75cc8e4_16","name":"6565","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*V9_1GuLP-MubGj8wxwwYgQ.png","originalHeight":508,"originalWidth":870,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Screenshots illustrating the resharing of old posts (1, 2) (Source CfA using X)","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":53,"end":54,"href":"https:\u002F\u002Fperma.cc\u002F66AC-RQHZ","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":56,"end":57,"href":"https:\u002F\u002Fperma.cc\u002F65K5-PCD3","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":0,"end":79,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_17":{"__typename":"Paragraph","id":"a136b75cc8e4_17","name":"f2d4","type":"P","href":null,"layout":null,"metadata":null,"text":"From 31 July 2024, the network began spreading several allegations of the Russian military’s counter-reaction to the attack. Specifically, the accounts claimed that Putin ordered the deployment of more heavy equipment, including guided missiles, fighter jets, sensor drones, and other types of combat aircraft in Mali, after discovering that NATO was behind the attack. The claims were copy-pasted and reworded 150 times, which contributed to their 75,587 social media interactions.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":152,"end":159,"href":"https:\u002F\u002Fperma.cc\u002FD46T-ZL3Q","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_18":{"__typename":"Paragraph","id":"a136b75cc8e4_18","name":"64c1","type":"P","href":null,"layout":null,"metadata":null,"text":"RFI’s fact-checking service has debunked these claims. They were taken out of context: one photo shows a helicopter being loaded onto a plane in Arizona for Ukraine in 2022, and the other depicts equipment being shipped from Alabama to Afghanistan in 2017. The article also highlights that propaganda accounts spread these false claims on platforms like X, Facebook, and TikTok. The Malian army has not officially communicated any such delivery of Russian equipment.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":32,"end":53,"href":"https:\u002F\u002Fperma.cc\u002FLCY4-6HCA","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_19":{"__typename":"Paragraph","id":"a136b75cc8e4_19","name":"357a","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*SaumJ0kU22o6OCzJLq4NkQ.png","originalHeight":946,"originalWidth":846,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Screenshots illustrating false news about Russia sending military equipment to Mali (1, 2, 3) (Source: CfA using X)","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":85,"end":86,"href":"https:\u002F\u002Fperma.cc\u002F2S6R-XDBP","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":88,"end":89,"href":"https:\u002F\u002Fperma.cc\u002FD46T-ZL3Q","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":91,"end":92,"href":"https:\u002F\u002Fperma.cc\u002F6GLB-BYNB","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":0,"end":90,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":91,"end":115,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_20":{"__typename":"Paragraph","id":"a136b75cc8e4_20","name":"94e5","type":"P","href":null,"layout":null,"metadata":null,"text":"Between 02 and 04 August 2024, a network of 82 Facebook pages copy-pasted a message claiming that a significant shipment of military equipment, including anti-aircraft missiles, helicopters, a MiG-35 fighter jet, tanks, and drones, was delivered to Bamako, Mali from Russia.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":76,"end":83,"href":"https:\u002F\u002Fperma.cc\u002FHG75-CJKS","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_21":{"__typename":"Paragraph","id":"a136b75cc8e4_21","name":"0f1d","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*ucwpJhtUoy54Mlcji-JmWA.png","originalHeight":408,"originalWidth":658,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Screenshots of posts about Russia sending military equipment (Source: CfA using Facebook)","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"EM","start":0,"end":89,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_22":{"__typename":"Paragraph","id":"a136b75cc8e4_22","name":"4a32","type":"P","href":null,"layout":null,"metadata":null,"text":"These posts have had ~27,000 interactions, including 1,751 comments, and were shared more than 2,000 times. Thirty-four of the pages in this network were administered from Mali, 27 from Burkina Faso, and four from Côte d’Ivoire. The same message was also copy-pasted in 143 Facebook groups.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_23":{"__typename":"Paragraph","id":"a136b75cc8e4_23","name":"dfdf","type":"P","href":null,"layout":null,"metadata":null,"text":"These posts, coming just after the deadly losses the Malian army and Wagner mercenaries experienced at Tinzaouaten, try to either boost morale among supporters, create the perception of strength, or counteract any negative impact of the loss. By highlighting a significant delivery of military equipment from Russia, the message aims to reassure the public and allies that the Malian government can still defend itself and prepare for future conflicts and that Wagner is a strong strategic partner.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_24":{"__typename":"Paragraph","id":"a136b75cc8e4_24","name":"a29d","type":"ULI","href":null,"layout":null,"metadata":null,"text":"Western powers are undermining Malian sovereignty","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":0,"end":49,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":0,"end":49,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_25":{"__typename":"Paragraph","id":"a136b75cc8e4_25","name":"5e53","type":"P","href":null,"layout":null,"metadata":null,"text":"In the aftermath of the Tinzaouaten attack, pan-Africanist, pro-Russian influencers played a crucial role in fueling anti-Western sentiments. These voices have intensified claims that the West, particularly former colonial powers, is compromising Mali’s sovereignty to reassert control over Africa and continue exploiting its resources.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_26":{"__typename":"Paragraph","id":"a136b75cc8e4_26","name":"8661","type":"P","href":null,"layout":null,"metadata":null,"text":"The anti-West media campaign began on 28 July 2024 and was driven mainly by two X accounts in the network, @DelphineSankara and @Abaslescons74. These accounts successively spread narratives accusing France, NATO, and Ukraine of financing terrorism in Mali and claimed that the real Malian war is against NATO, which it described as the ‘association of slavery criminals’. The posts received six copy-pasted shares immediately, which helped to achieve 21,155 social media interactions and 121,700 views.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":107,"end":123,"href":"https:\u002F\u002Fperma.cc\u002FD7Q9-DEBM?type=standard","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":128,"end":142,"href":"https:\u002F\u002Fperma.cc\u002F7YZM-PX82","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_27":{"__typename":"Paragraph","id":"a136b75cc8e4_27","name":"65c4","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*Dzr6aSzaoUcPgjl-EoZuWA.png","originalHeight":906,"originalWidth":838,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Screenshots illustrating the copy-paste technique (1, 2, 3, 4) (Source: CfA using X)","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":51,"end":52,"href":"https:\u002F\u002Fperma.cc\u002F2LVQ-6XES","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":54,"end":55,"href":"https:\u002F\u002Fperma.cc\u002FN3FZ-PLTN","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":57,"end":58,"href":"https:\u002F\u002Fperma.cc\u002FHP5A-J7TW","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":60,"end":61,"href":"https:\u002F\u002Fperma.cc\u002FVGR8-VUWG","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":0,"end":84,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_28":{"__typename":"Paragraph","id":"a136b75cc8e4_28","name":"1963","type":"P","href":null,"layout":null,"metadata":null,"text":"A day later, on 29 July 2024, the @MankanMoo X account in the network joined the campaign, posting claims that NATO had plans to punish and destroy AES and all countries with Russian ties. The allegations gained 3,356 social media interactions.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":34,"end":44,"href":"https:\u002F\u002Fperma.cc\u002FN4SJ-B7WH?type=standard","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":148,"end":151,"href":"https:\u002F\u002Fperma.cc\u002F5683-NUXZ","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":160,"end":169,"href":"https:\u002F\u002Fperma.cc\u002F7V8Q-YBYX","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_29":{"__typename":"Paragraph","id":"a136b75cc8e4_29","name":"854f","type":"P","href":null,"layout":null,"metadata":null,"text":"Another network that has been instrumental in blaming the West for the attack is linked to several video interviews and posts published on the Gandhi Malien media platforms. Gandhi Malien has several media platforms, including a Facebook page, created in February 2018; a YouTube channel; and, more recently, a television station in Mali. The ‘media house’ is owned and run by Malian influencer Mamdou Sidibé, who has visited Russia at the invitation of the African Initiative. The Gandhi Malien platforms focus on Malian news, politics, and current events.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":229,"end":237,"href":"https:\u002F\u002Fperma.cc\u002FH6XQ-L3D7","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":272,"end":279,"href":"https:\u002F\u002Fperma.cc\u002F4LMH-BLU9","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_30":{"__typename":"Paragraph","id":"a136b75cc8e4_30","name":"65f4","type":"P","href":null,"layout":null,"metadata":null,"text":"On 29 July 2024, in an interview with Sidibé, political commentator and influencer Issa Diawara alleged that France invited NATO into Mali and handed over control of the Kidal region. The interview was published on the latter’s Gandhi Malien YouTube channel and Facebook page. Diawara claimed that the US has extensive intelligence on Mali, including detailed knowledge of the Malian army’s positions and military locations. He also claimed that on 22 July 2024, the head of the United States Africa Command (AFRICOM) visited Algeria to support the attack against the Malian army at Tinzaouaten. Diawara accused foreign forces, including the US, of collaborating with terrorist groups like the CSP-DPA, JNIM, and Al-Qaeda in the Islamic Maghreb in Algeria to carry out the Tinzaouaten attack.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":242,"end":249,"href":"https:\u002F\u002Fperma.cc\u002F8T5E-WXRX","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":262,"end":270,"href":"https:\u002F\u002Fperma.cc\u002FM8HU-CBJL","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":508,"end":517,"href":"https:\u002F\u002Fperma.cc\u002FNA53-M929","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_31":{"__typename":"Paragraph","id":"a136b75cc8e4_31","name":"068e","type":"P","href":null,"layout":null,"metadata":null,"text":"In the same interview, published on the Gandhi Malien Facebook page on 29 July 2024, CMA chief Alghabass Ag Intalla accused the US of rallying other countries to support Ukraine in the war against Russia. He also claimed the US is falsely implicating Ukraine in Mali’s conflict as a cover up to obscure the actual involvement of US and French forces in the Tinzaouaten attack. He noted the presence of US troops in neighbouring countries like Mauritania and Côte d’Ivoire, suggesting that the US is strategically positioning its forces around Mali, which could pose a direct threat to the country.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":12,"end":21,"href":"https:\u002F\u002Fperma.cc\u002F8TZ5-EZM3","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_32":{"__typename":"Paragraph","id":"a136b75cc8e4_32","name":"27fd","type":"P","href":null,"layout":null,"metadata":null,"text":"On 30 July 2024, the Gandhi Malien Facebook page posted an interview with Diawara, claiming the attack was orchestrated by NATO and that its involvement is part of a larger strategy to shift the conflict from Ukraine to Africa. Diawara said this represents a ‘recolonisation’ of Africa ‘as promised by the French general’, implying that Western powers, particularly France and NATO, are seeking to reassert control over the continent. The post cautions Africans against being deceived by media narratives and emphasises that no African country will be spared from these geopolitical manoeuvres.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":49,"end":68,"href":"https:\u002F\u002Fperma.cc\u002FVQ7X-CTU2","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_33":{"__typename":"Paragraph","id":"a136b75cc8e4_33","name":"821f","type":"P","href":null,"layout":null,"metadata":null,"text":"On 07 August 2024, Malian influencer Issa Cissé was interviewed by Sidibé on the Gandhi Malien Facebook page, saying that a third world war could begin in Mali. Cissé emphasised that Mali would not be intimidated by external powers, specifically accusing France of attempting to destabilise the country. He also accused the West, particularly NATO, of instigating terrorism in the Sahel region. During the interview, Cissé said that the West’s failure to condemn Ukraine’s interference in Mali indicated its complicity in perpetuating terrorism.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":52,"end":63,"href":"https:\u002F\u002Fperma.cc\u002F27GZ-KWYC","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":81,"end":94,"href":"https:\u002F\u002Fperma.cc\u002F8P9C-ZLBQ","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_34":{"__typename":"Paragraph","id":"a136b75cc8e4_34","name":"4fba","type":"P","href":null,"layout":null,"metadata":null,"text":"Tracking the timeline of events","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":0,"end":31,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_35":{"__typename":"Paragraph","id":"a136b75cc8e4_35","name":"d938","type":"OLI","href":null,"layout":null,"metadata":null,"text":"On Wagner-affiliated pages","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":0,"end":26,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":0,"end":26,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_36":{"__typename":"Paragraph","id":"a136b75cc8e4_36","name":"4590","type":"P","href":null,"layout":null,"metadata":null,"text":"Wagner-affiliated channels, particularly on Telegram, have been active in addressing the setbacks faced by its forces by blaming ‘external factors’, such as alleged foreign involvement, to justify their losses. By framing the conflict as one influenced by outside forces, these channels aim to rally support for Wagner’s continued presence in the region and to mitigate the impact of their recent defeats.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_37":{"__typename":"Paragraph","id":"a136b75cc8e4_37","name":"e8a2","type":"ULI","href":null,"layout":null,"metadata":null,"text":"28 July 2024: Rybar, a Russia-affiliated Telegram channel, confirmed the ambush on Wagner, linking CMA to JNIM and justifying the defeat due to limited forces and foreign involvement. This message was widely shared across 10 channels, reaching more than 818,358 views.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":59,"end":68,"href":"https:\u002F\u002Fperma.cc\u002FZ2VR-XZAT","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":13,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_38":{"__typename":"Paragraph","id":"a136b75cc8e4_38","name":"fcf5","type":"ULI","href":null,"layout":null,"metadata":null,"text":"29 July 2024: The African Initiative Telegram channel confirmed the attack, reporting 25 Wagner fighters killed, although CSP-DPA reported 84. The channel speculated that the official Russian military might replace Russian ‘volunteers’ in the Sahel. It also accused French intelligence of supporting CMA and speculated on Ukrainian involvement indirectly supporting JNIM. This message gained significant traction, with 64,500 views and 148 forwards.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":54,"end":63,"href":"https:\u002F\u002Fperma.cc\u002FWWK7-MC4Z","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":130,"end":138,"href":"https:\u002F\u002Fperma.cc\u002F2TCM-YQNR","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":258,"end":265,"href":"https:\u002F\u002Fperma.cc\u002FZ2VR-XZAT","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":13,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_39":{"__typename":"Paragraph","id":"a136b75cc8e4_39","name":"68d1","type":"ULI","href":null,"layout":null,"metadata":null,"text":"25 July to 02 August 2024: Russian Telegram channels increased coverage of Mali, attempting to justify the Wagner defeat and accusing external forces of supporting CMA and JNIM. Some 190 Telegram channels participated in this coverage, producing 633 posts.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":0,"end":26,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_40":{"__typename":"Paragraph","id":"a136b75cc8e4_40","name":"79bf","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*KLdNLwygUOfTA1S73d4G9g.png","originalHeight":132,"originalWidth":1178,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"A screenshot shows the rate of publishing about Mali, Russia, and Wagner on Telegram between 25 July and 02 August 2024 (Source: CfA using Open Measures)","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"EM","start":0,"end":153,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_41":{"__typename":"Paragraph","id":"a136b75cc8e4_41","name":"88ad","type":"P","href":null,"layout":null,"metadata":null,"text":"2. On JNIM-affiliated pages","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":0,"end":27,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":0,"end":27,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_42":{"__typename":"Paragraph","id":"a136b75cc8e4_42","name":"0ac0","type":"P","href":null,"layout":null,"metadata":null,"text":"As early as April and May 2024 and intensifying in June and July 2024, JNIM-affiliated pages actively reported on the group’s operations against the Malian army and Wagner forces. Their posts not only detailed successful attacks, but also criticised the Malian government and its allies, stirring up political and social unrest. The timeline of events shared by these pages reflects JNIM’s efforts to assert its influence and bolster its image among supporters, while simultaneously condemning foreign intervention and alleged atrocities by opposing forces.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_43":{"__typename":"Paragraph","id":"a136b75cc8e4_43","name":"3324","type":"ULI","href":null,"layout":null,"metadata":null,"text":"April 2024: JNIM made dozens of posts about targeting the Malian army’s military bases, military airports, and security checkpoints. Some of these posts referred to attacks by JNIM against Wagner forces and claimed successful engagements with them in different areas through various attacks.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":0,"end":10,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_44":{"__typename":"Paragraph","id":"a136b75cc8e4_44","name":"8b5d","type":"ULI","href":null,"layout":null,"metadata":null,"text":"02 May 2024: JNIM’s Az-Zallaqa alleged that the Malian government, together with its Russian allies, had demolished homes, destroyed wells, and looted money and valuables. Furthermore, it claimed that, on 29 April 2024, the Malian army, in conjunction with Wagner mercenaries, summarily executed seven civilians. In addition, unarmed herdsmen in the village of Kiss (Mana) in Koulikoro state, Mali were reportedly detained on the same day. JNIM’s Az-zallaqa also asserted that on 30 April 2024, a patrol committed a ‘heinous act’ in the village of Galo, resulting in the deaths of nine locals. The bodies were allegedly mutilated and then set on fire. However, the Malian army presented a different narrative. According to its reports, on 27 April 2024, the army apprehended a suspected terrorist of foreign nationality in the Timbuktu region. In addition, on 28 April 2024, a significant terrorist leader of foreign origin was reportedly eliminated during a large-scale operation in the Liptako region, Mali.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":31,"end":38,"href":"https:\u002F\u002Fperma.cc\u002F9K5B-NKJ3","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":699,"end":708,"href":"https:\u002F\u002Fperma.cc\u002FTS8E-GP6A","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":11,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_45":{"__typename":"Paragraph","id":"a136b75cc8e4_45","name":"5069","type":"ULI","href":null,"layout":null,"metadata":null,"text":"09 May 2024: JNIM’s Chirpwire media account announced that its fighters had defeated Malian army and Wagner soldiers, but at different locations between Tanka and Niafonki, areas in Mali also known for frequent clashes. In addition, on 16 May 2024, the same account claimed that Wagner mercenaries killed five Malian civilians.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":44,"end":53,"href":"https:\u002F\u002Fperma.cc\u002FB3ZH-FXM4","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":266,"end":273,"href":"https:\u002F\u002Fperma.cc\u002FY5KD-9N4S","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":11,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_46":{"__typename":"Paragraph","id":"a136b75cc8e4_46","name":"34a6","type":"ULI","href":null,"layout":null,"metadata":null,"text":"20 June 2024: JNIM’s Az-Zallaqa Chirpwire account reported an attack targeting the Malian army and Wagner forces in Macina, Ségou region, Mali — a significant location of clashes.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":50,"end":58,"href":"https:\u002F\u002Fperma.cc\u002FGT6R-2YLG","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":13,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_47":{"__typename":"Paragraph","id":"a136b75cc8e4_47","name":"0be9","type":"ULI","href":null,"layout":null,"metadata":null,"text":"25 June 2024: JNIM accused the Malian army and Wagner of killing 15 people in Kidal and urged political parties in Malian capital Bamako to clarify their stances.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":19,"end":26,"href":"https:\u002F\u002Fperma.cc\u002FN23K-UBT3","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":13,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_48":{"__typename":"Paragraph","id":"a136b75cc8e4_48","name":"d169","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*pR9KGDJju-gBJ67OJZimlA.png","originalHeight":826,"originalWidth":502,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Screenshot of JNIM statement (Source: CfA using Chirpwire)","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"EM","start":0,"end":58,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_49":{"__typename":"Paragraph","id":"a136b75cc8e4_49","name":"cab5","type":"ULI","href":null,"layout":null,"metadata":null,"text":"08 July 2024: JNIM reported another attack on the Malian army and Wagner in Macina on Chirpwire.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":19,"end":27,"href":"https:\u002F\u002Fperma.cc\u002FKHN7-GJPA","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":13,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_50":{"__typename":"Paragraph","id":"a136b75cc8e4_50","name":"a962","type":"ULI","href":null,"layout":null,"metadata":null,"text":"27 July 2024: JNIM claimed responsibility for the Tinzaouaten attack, alleging the deaths of 50 Wagner mercenaries and 10 Malian soldiers.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":19,"end":26,"href":"https:\u002F\u002Fperma.cc\u002FN95U-MMA9","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":13,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_51":{"__typename":"Paragraph","id":"a136b75cc8e4_51","name":"7652","type":"ULI","href":null,"layout":null,"metadata":null,"text":"31 July 2024: JNIM condemned the AES’s alleged participation in the attacks against civilians in Mali. JNIM also disputed the Malian army’s claims about the operation, stating it resulted in the deaths of innocent civilians.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":19,"end":28,"href":"https:\u002F\u002Fperma.cc\u002F947X-ZRTC","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":13,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_52":{"__typename":"Paragraph","id":"a136b75cc8e4_52","name":"8bbc","type":"ULI","href":null,"layout":null,"metadata":null,"text":"01 August 2024: JNIM released a statement in Arabic and French condemning CSP-DPA for denying JNIM’s involvement in the Tinzaouaten attacks, emphasising its key role and asserting its continued jihad against oppressive regimes.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":45,"end":51,"href":"https:\u002F\u002Fperma.cc\u002F8XJF-48LU","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":56,"end":62,"href":"https:\u002F\u002Fperma.cc\u002F886P-A5BD","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":15,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_53":{"__typename":"Paragraph","id":"a136b75cc8e4_53","name":"46f5","type":"P","href":null,"layout":null,"metadata":null,"text":"3. On CMA-affiliated pages","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":0,"end":26,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":0,"end":26,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_54":{"__typename":"Paragraph","id":"a136b75cc8e4_54","name":"ab52","type":"P","href":null,"layout":null,"metadata":null,"text":"Similarly, CMA-affiliated pages have been vocal in documenting the conflict, particularly focusing on the organisation’s resistance against the Malian forces and Wagner mercenaries. The updates from CMA-affiliated pages, ranging from reports of ongoing battles to accusations of war crimes, underscore the intensity of the conflict and the coalition’s determination to defend the Azawad region. These narratives often emphasise CMA’s distinct role and objectives, particularly in safeguarding Azawadi autonomy.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_55":{"__typename":"Paragraph","id":"a136b75cc8e4_55","name":"3152","type":"ULI","href":null,"layout":null,"metadata":null,"text":"10 June 2024: An X account called ‘Akli’ shared a video showing his visit to CMA members, expressing joy in meeting them. He claimed that the fight against the Malian forces and Wagner was ongoing and that, despite not receiving salaries, the fighters remained committed.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":41,"end":47,"href":"https:\u002F\u002Fperma.cc\u002FJ5AQ-FY9F?type=standard","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":13,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_56":{"__typename":"Paragraph","id":"a136b75cc8e4_56","name":"96c8","type":"ULI","href":null,"layout":null,"metadata":null,"text":"05 July 2024: CMA-affiliated Azawad News posted a statement titled ‘A statement of condemnation, denunciation, and condolence regarding the massacre of 60 civilians in the Azawad region’, accusing the Malian army and Wagner of killing 60 people in Kidal, northern Mali. The statement was similar to the one JNIM posted on 25 June 2024 condemning the same attack.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":41,"end":47,"href":"https:\u002F\u002Fperma.cc\u002FDE2B-7FX7?type=standard","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":13,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_57":{"__typename":"Paragraph","id":"a136b75cc8e4_57","name":"d4b7","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*oDGZDNtR1ktOUMVrekPtyg.png","originalHeight":698,"originalWidth":538,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Screenshot of CMA statements (Source: CfA using Facebook)","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"EM","start":0,"end":57,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_58":{"__typename":"Paragraph","id":"a136b75cc8e4_58","name":"77b7","type":"ULI","href":null,"layout":null,"metadata":null,"text":"25 July 2024: The M24 Media Facebook page reported an ongoing clash between Azawad forces, Malian forces, and Wagner in Tinzaouaten at 11.50am. Later posts detailed clashes taking place 5km from Tinzaouaten.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":42,"end":50,"href":"https:\u002F\u002Fperma.cc\u002FLJV3-4M59","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":13,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_59":{"__typename":"Paragraph","id":"a136b75cc8e4_59","name":"d90e","type":"ULI","href":null,"layout":null,"metadata":null,"text":"25 to 27 July 2024: The Arab Azawad Movement posted more than 50 updates on the Tinzaouaten attacks, sharing footage and details of losses. On 26 July 2024, the page stated that, despite the Malian army’s attempts at secrecy about the casualties, relatives of forces who died publicly shared their photos, revealing their identities.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":20,"end":44,"href":"https:\u002F\u002Fperma.cc\u002FB6ZH-BMSS","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":101,"end":108,"href":"https:\u002F\u002Fperma.cc\u002F3DG5-LMXX","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":19,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_60":{"__typename":"Paragraph","id":"a136b75cc8e4_60","name":"009e","type":"ULI","href":null,"layout":null,"metadata":null,"text":"26 July 2024: The Azawad News Center (AZC) account on X published a post stating that ‘sources from the battleground’ told the AZC that, ‘The Malian army and Wagner mercenaries began to retreat and disperse on the battlefield, spreading strong panic among them, with Azawad fighters controlling the course of the fighting taking place since 25 July in the Tinzouaten region on the Algerian border with Azawad.’","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":56,"end":72,"href":"https:\u002F\u002Fperma.cc\u002FW8V4-U3KZ","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":13,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_61":{"__typename":"Paragraph","id":"a136b75cc8e4_61","name":"e222","type":"ULI","href":null,"layout":null,"metadata":null,"text":"28 July 2024: The Arab Azawad Movement shared videos of captured Wagner and Malian army members (one, two, three).","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":97,"end":100,"href":"https:\u002F\u002Fperma.cc\u002F82QM-5CM8","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":102,"end":105,"href":"https:\u002F\u002Fperma.cc\u002F49PH-NUKF","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":107,"end":112,"href":"https:\u002F\u002Fperma.cc\u002F5JFV-LV6T","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":14,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_62":{"__typename":"Paragraph","id":"a136b75cc8e4_62","name":"75fd","type":"ULI","href":null,"layout":null,"metadata":null,"text":"29 July 2024: The Arab Azawad Movement Facebook page claimed that the Azawad army eliminated a significant special unit in Tinzaouaten, which included Anton Yelizarov, Wagner’s commander-in-chief in Africa and Libya. The unit had been tasked with locating valuable resources in Azawad and allegedly intended to eliminate Malian soldiers to keep their discoveries secret.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":53,"end":60,"href":"https:\u002F\u002Fperma.cc\u002FM9SL-CSL4","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":151,"end":166,"href":"https:\u002F\u002Fperma.cc\u002FC9F9-HEC4","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":14,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_63":{"__typename":"Paragraph","id":"a136b75cc8e4_63","name":"7155","type":"ULI","href":null,"layout":null,"metadata":null,"text":"31 July 2024: The Arab Azawad Movement Facebook page also alleged that the Malian army, with Wagner’s help, killed individuals and took their ID cards, which were now in CMA’s possession.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":58,"end":65,"href":"https:\u002F\u002Fperma.cc\u002F8SBR-M23C","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":14,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_64":{"__typename":"Paragraph","id":"a136b75cc8e4_64","name":"1fe4","type":"ULI","href":null,"layout":null,"metadata":null,"text":"01 August 2024: The CSP-DPA spokesperson stated that battles in the Tinzaouaten area from 25 to 27 July 2024 led to the complete neutralisation of all enemy columns, with Azawad forces killing 84 Wagner forces and 47 Malian soldiers, as well as capturing seven fighters. They also acquired weapons and equipment. CMA advocate @Ag_Asahra blamed ‘entities’, likely referring to JNIM, for trying to claim victory for themselves.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":41,"end":47,"href":"https:\u002F\u002Fperma.cc\u002F2TCM-YQNR","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":0,"end":16,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_65":{"__typename":"Paragraph","id":"a136b75cc8e4_65","name":"8175","type":"P","href":null,"layout":null,"metadata":null,"text":"Disinformation and the geopolitical fight for influence","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":0,"end":55,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_66":{"__typename":"Paragraph","id":"a136b75cc8e4_66","name":"14b9","type":"P","href":null,"layout":null,"metadata":null,"text":"The Tinzaouaten clashes marked a turning point in the ongoing conflict in Mali, with the real battleground extended beyond the physical conflict to the realm of information warfare. Pro-Russian networks capitalised on the attack to push anti-Western narratives while portraying Russia as Mali’s steadfast ally against foreign interference. This strategic disinformation campaign sought not only to justify Wagner’s presence, but also to deepen anti-Western sentiment across the region.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_67":{"__typename":"Paragraph","id":"a136b75cc8e4_67","name":"db7d","type":"P","href":null,"layout":null,"metadata":null,"text":"The narrative surrounding the Tinzaouaten attack highlights the ongoing battle for influence and control in Mali, driven by a complex web of local insurgent groups, foreign mercenaries, and geopolitical interests. As JNIM and CMA continue to vie for dominance and legitimacy, the presence of Wagner mercenaries in Mali and their portrayal as protectors against extremist threats have contributed to the appeal of pro-Russian sentiments. Local influencers and political commentators amplify this message, framing Russia as a bulwark against Western imperialism and as a genuine partner invested in Mali’s self-determination.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_68":{"__typename":"Paragraph","id":"a136b75cc8e4_68","name":"5a6e","type":"P","href":null,"layout":null,"metadata":null,"text":"Social media channels and platforms have played a crucial role in disseminating these narratives, often portraying Russia as a more reliable ally compared to the perceived duplicity of Western countries. The strategic alignment of pro-Russian narratives with local sociopolitical contexts, including the emphasis on sovereignty, anti-colonialism, and resource control, has further solidified their traction. The conflict in Tinzaouaten is not just a local skirmish, but a microcosm of the broader power struggle between extremist groups, Wagner, and the future of Mali and the wider Sahel region.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_69":{"__typename":"Paragraph","id":"a136b75cc8e4_69","name":"b6e7","type":"P","href":null,"layout":null,"metadata":null,"text":"This report was co-written by CfA iLAB senior investigation manager Jacktone Momanyi and iLAB investigative data analysts Christian Ngnie, Eliud Akwei, Lujain Alsedeg, Khattab Hamad, Mbe Ndetatsin Landry, Soumare Modi, and Tagwa Warrag. It was edited and reviewed by CfA iLAB copy editor Theresa Mallinson, CfA iLAB insights manager Mwende Mukwanyaga, and CfA iLAB managing editor Athandiwe Saba.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":68,"end":85,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":121,"end":137,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":138,"end":150,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":151,"end":166,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":167,"end":181,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":183,"end":203,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":204,"end":217,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":218,"end":219,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":223,"end":235,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":236,"end":237,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":288,"end":305,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":306,"end":307,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":333,"end":350,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":381,"end":395,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":0,"end":396,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:a136b75cc8e4_70":{"__typename":"Paragraph","id":"a136b75cc8e4_70","name":"c6df","type":"P","href":null,"layout":null,"metadata":null,"text":"You can read the French translation of the report here.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":50,"end":54,"href":"https:\u002F\u002Fdisinfo.africa\u002Ftinzaouaten-attacks-unpacking-the-narratives-and-actors-french-cd4354111d66","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Membership:f1a9021c-ddca-452e-9dc7-2bca8b88e8e6":{"__typename":"Membership","id":"f1a9021c-ddca-452e-9dc7-2bca8b88e8e6"},"CollectionViewerEdge:collectionId:524f394c6433-viewerId:lo_d8ea5b94a726":{"__typename":"CollectionViewerEdge","id":"collectionId:524f394c6433-viewerId:lo_d8ea5b94a726","isEditor":false,"isMuting":false},"UserViewerEdge:userId:74788ae4731c-viewerId:lo_d8ea5b94a726":{"__typename":"UserViewerEdge","id":"userId:74788ae4731c-viewerId:lo_d8ea5b94a726","isMuting":false},"PostViewerEdge:postId:fe74008c7c00-viewerId:lo_d8ea5b94a726":{"__typename":"PostViewerEdge","hasReposted":false,"id":"postId:fe74008c7c00-viewerId:lo_d8ea5b94a726","repostNote":null},"Post:fe74008c7c00":{"__typename":"Post","id":"fe74008c7c00","isPublished":true,"allowResponses":true,"isLimitedState":fal
